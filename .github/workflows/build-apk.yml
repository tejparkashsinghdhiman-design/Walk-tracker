name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy web app into www (with Today tab)
        run: |
          mkdir -p www
          cp index.html daily.js www/
          sed -i 's#</body>#<script src="daily.js"></script></body>#' www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Patch manifest and add native step counter
        run: |
          python3 native/patch_manifest.py
          D=android/app/src/main/java/com/walktracker/app
          mkdir -p $D
          cp native/*.java $D/
          cp -r native/res/. android/app/src/main/res/

      - name: Use fixed signing key and set version
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --build-cache

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WalkTracker.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalkTracker-apk
          path: WalkTracker.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Walk Tracker APK build ${{ github.run_number }}
          make_latest: true
          files: WalkTracker.apk
